[build]
  publish = "frontend"
  functions = "netlify/functions"

# Route /api/* requests to Netlify Serverless Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# OPTIONAL: If hosting backend separately on Render/Railway, comment out the section above and uncomment below:
# [[redirects]]
#   from = "/api/*"
#   to = "https://YOUR-RENDER-APP-NAME.onrender.com/api/:splat"
#   status = 200
#   force = true
